<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evil Nun - Play Game</title>
    <style>
        /* Remove default margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Black background while loading */
        }

        /* Make the iframe fill the entire screen */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Embedded Game Frame -->
    <iframe 
        src="https://zapgames.io/evil-nun" 
        allow="autoplay; fullscreen; keyboard"
        sandbox="allow-scripts -> Note: If the game requires popups or same-origin storage, you can use standard sandbox permissions if needed.">
    </iframe>

</body>
</html>
