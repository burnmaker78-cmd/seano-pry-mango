<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes Mango</title>
    <style>
        /* Force the page wrapper to fill 100% of the screen without scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        /* Scale the iframe completely to the boundaries */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Fixed Game Frame -->
    <iframe 
        src="https://zapgames.io" 
        allow="autoplay; fullscreen; keyboard"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

</body>
</html>
